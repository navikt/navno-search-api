# Builds main and deploys it to prod - shared by deploy-to-prod.yml and base-image-refresh.yml
# Callers need `permissions: { contents: read, id-token: write, packages: read }` and `secrets: inherit`.
name: Build and deploy to prod
on:
  workflow_call:
    outputs:
      image:
        description: The deployed image, digest-pinned.
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    uses: navikt/navno-ci/.github/workflows/jvm-build.yml@v1
    permissions: { contents: read, id-token: write, packages: read }
    secrets: inherit

  deploy:
    needs: build
    uses: navikt/navno-ci/.github/workflows/nais-deploy.yml@v1
    permissions: { contents: read, id-token: write }
    with:
      cluster: prod-gcp
      resource: .nais/nais.yaml
      vars: .nais/prod-gcp/navno.json
      workload-image: ${{ needs.build.outputs.image }}
